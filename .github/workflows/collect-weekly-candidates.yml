name: collect-weekly-candidates

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "14"
      max_per_query:
        description: "Max candidates per source query"
        required: false
        default: "5"
  schedule:
    - cron: "30 1 * * 1"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect candidate records
        run: |
          python scripts/collect_weekly_candidates.py \
            --days "${{ inputs.days || '14' }}" \
            --max-per-query "${{ inputs.max_per_query || '5' }}" \
            --timeout 18
      - name: Build source search plan
        run: python scripts/build_search_plan.py
      - name: Evaluate search quality
        run: python scripts/evaluate_search_plan.py
      - name: Validate existing public reports
        run: |
          python scripts/assign_primary_modules.py
          python scripts/validate_reports.py
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-candidates-and-search-plan
          path: |
            docs/staging/weekly-candidates.json
            docs/staging/search-plan.json
            docs/staging/search-quality-report.json
