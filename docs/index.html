<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#x5ef6;&#x8870;&#x6280;&#x672f;&#x5468;&#x62a5;</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f1;
        --panel: #ffffff;
        --panel-soft: #eef4ef;
        --ink: #0f3038;
        --muted: #6d7f7f;
        --line: #d9e2dd;
        --deep: #102f38;
        --deep-2: #1f5d52;
        --gold: #d99a2b;
        --green: #176457;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }

      a {
        color: inherit;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 16px 32px;
        border-bottom: 1px solid rgba(15, 48, 56, 0.12);
        background: rgba(244, 246, 241, 0.94);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 50%;
        background: var(--deep);
        color: #fff;
        font-weight: 800;
      }

      .brand small,
      .meta,
      .card-original,
      .hint {
        color: var(--muted);
      }

      .shell {
        display: grid;
        grid-template-columns: 276px minmax(0, 1fr);
        gap: 24px;
        max-width: 1500px;
        margin: 0 auto;
        padding: 22px 28px 64px;
      }

      .sidebar {
        position: sticky;
        top: 86px;
        align-self: start;
      }

      .nav-label,
      .kicker {
        margin: 0 0 12px;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .module-button {
        width: 100%;
        display: grid;
        grid-template-columns: 34px 1fr 34px;
        align-items: center;
        gap: 9px;
        min-height: 48px;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .module-button.active {
        background: var(--deep);
        color: #fff;
      }

      .module-code {
        color: var(--gold);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
      }

      .module-count {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: rgba(15, 48, 56, 0.08);
        font-style: normal;
      }

      .module-button.active .module-count {
        background: rgba(255, 255, 255, 0.16);
      }

      .subnav {
        display: grid;
        gap: 2px;
        margin: 0 0 8px 43px;
      }

      .subnav button {
        width: 100%;
        padding: 4px 6px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        font-size: 12px;
        line-height: 1.35;
        cursor: pointer;
      }

      .subnav button:hover {
        background: rgba(15, 48, 56, 0.06);
        color: var(--ink);
      }

      .subnav em {
        float: right;
        color: var(--gold);
        font-style: normal;
      }

      .hero {
        padding: 42px 48px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 94% 8%, rgba(255, 255, 255, 0.12) 0 120px, transparent 121px),
          linear-gradient(120deg, #102d38, #1f5b52);
        color: #fff;
      }

      .hero .kicker {
        color: #e6b96a;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 18px;
        font-size: clamp(42px, 7vw, 76px);
        line-height: 1.04;
        letter-spacing: 0;
      }

      .hero-summary {
        max-width: 980px;
        margin-bottom: 20px;
        font-size: clamp(20px, 3vw, 32px);
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.88);
      }

      .edition-note {
        max-width: 760px;
        margin: 24px 0;
        padding: 16px 20px;
        border-left: 4px solid var(--gold);
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.86);
        font-weight: 700;
      }

      .hero-foot {
        color: rgba(255, 255, 255, 0.66);
      }

      .archive-card,
      .focus-card {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .archive-card {
        margin-top: 0;
        background: #edf3ee;
      }

      .archive-card h2,
      .focus-card h2 {
        margin-bottom: 10px;
        font-size: 24px;
      }

      .brief-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 16px;
      }

      .brief-lead {
        padding: 18px;
        border-radius: 8px;
        background: #102f38;
        color: #fff;
      }

      .brief-lead h3 {
        margin-bottom: 10px;
        font-size: 28px;
        line-height: 1.25;
      }

      .brief-lead p {
        margin-bottom: 0;
        color: rgba(255, 255, 255, 0.82);
        font-size: 16px;
        line-height: 1.75;
      }

      .brief-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .brief-metric {
        padding: 14px;
        border-radius: 8px;
        background: #eef4ef;
      }

      .brief-metric strong {
        display: block;
        color: var(--gold);
        font-family: Georgia, serif;
        font-size: 28px;
        line-height: 1;
      }

      .brief-metric span {
        display: block;
        margin-top: 6px;
        color: #496063;
        font-size: 13px;
        font-weight: 800;
      }

      .archive-card select {
        margin-top: 8px;
      }

      .focus-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding-left: 22px;
      }

      .focus-list li {
        line-height: 1.65;
      }

      .signal-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin: 24px 0;
      }

      .panel,
      .filter-panel,
      .weekly-card,
      .score-note {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .panel {
        padding: 24px;
      }

      .panel h2 {
        font-size: 24px;
      }

      .panel ul {
        margin: 14px 0 0;
        padding-left: 20px;
      }

      .panel li {
        margin: 10px 0;
        line-height: 1.7;
      }

      .workspace-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 32px 0 18px;
      }

      .workspace-head h2 {
        margin-bottom: 0;
        font-size: 36px;
      }

      .filter-panel {
        padding: 22px;
        background: #edf3ee;
      }

      .search-field {
        display: block;
        margin-bottom: 18px;
      }

      label span {
        display: block;
        margin-bottom: 8px;
        color: #607675;
        font-size: 13px;
        font-weight: 800;
      }

      input,
      select {
        width: 100%;
        min-height: 48px;
        border: 1px solid #cfdad4;
        border-radius: 6px;
        padding: 0 14px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
      }

      .score-note {
        margin-top: 14px;
        padding: 14px 16px;
        color: #456064;
        line-height: 1.65;
        background: #fffdf6;
      }

      .module-section {
        margin-top: 34px;
      }

      .module-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 20px;
        padding: 24px 28px;
        border: 1px solid var(--line);
        border-left: 10px solid var(--deep);
        border-radius: 8px;
        background: linear-gradient(90deg, #ffffff, #edf3ee 62%, #e2ebe6);
        box-shadow: 0 8px 24px rgba(15, 48, 56, 0.06);
      }

      .module-heading h2 {
        margin-bottom: 4px;
        font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
        font-size: 34px;
        font-weight: 900;
        line-height: 1.25;
      }

      .item-stack {
        display: grid;
        gap: 16px;
      }

      .module-items {
        display: grid;
        gap: 22px;
      }

      .subgroup-section {
        display: grid;
        gap: 12px;
      }

      .subgroup-title {
        margin: 0;
        padding: 18px 24px;
        border-left: 10px solid var(--gold);
        border-radius: 6px;
        background: #eef4ef;
        color: var(--ink);
        font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
        font-size: 31px;
        font-weight: 900;
        line-height: 1.35;
      }

      .subgroup-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px;
        border-left: 10px solid var(--gold);
        border-radius: 6px;
        background: #eef4ef;
      }

      .subgroup-head .subgroup-title {
        padding: 0;
        border-left: 0;
        background: transparent;
      }

      .batch-control {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        flex: 0 0 auto;
      }

      .batch-meta {
        color: #60777b;
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
      }

      .batch-button {
        min-height: 36px;
        min-width: 36px;
        padding: 7px 12px;
        border: 1px solid #d9a43a;
        border-radius: 4px;
        background: #fffaf0;
        color: #8c5f0a;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
      }

      .batch-button:hover {
        background: #f8efd9;
      }

      .batch-button.active {
        background: var(--gold);
        color: #fff;
      }

      .batch-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .weekly-card {
        position: relative;
        padding: 24px;
        overflow: hidden;
      }

      .weekly-card.media-card {
        border-color: #d7c5ea;
        background: linear-gradient(180deg, #fff, #fbf7ff);
      }

      .weekly-card.interview-card {
        border-color: #c9d9ec;
        background: linear-gradient(180deg, #fff, #f6fbff);
      }

      .media-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 16px;
      }

      .media-field {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.75);
      }

      .media-field strong {
        display: block;
        margin-bottom: 6px;
        color: var(--green);
      }

      .media-field p {
        margin-bottom: 0;
        color: #40585c;
        line-height: 1.65;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 18px;
        margin-bottom: 18px;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid #d7e2dc;
        background: #eef6f2;
        color: #0d5d54;
        font-size: 13px;
        font-weight: 800;
      }

      .source-badge {
        background: #f0f2ef;
        color: #576b6b;
      }

      .score-value {
        color: #b06d14;
        font-family: Georgia, serif;
        font-size: 24px;
        font-weight: 700;
      }

      .weekly-card h3 {
        max-width: 980px;
        margin-bottom: 10px;
        font-size: 27px;
        line-height: 1.35;
      }

      .card-original {
        margin-bottom: 22px;
        font-family: Georgia, serif;
        font-size: 18px;
        font-style: italic;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .overview-cell {
        display: grid;
        grid-template-columns: 132px 1fr;
        gap: 18px;
        min-height: 132px;
        padding: 22px 24px 22px 0;
        border-bottom: 1px solid var(--line);
      }

      .overview-cell:nth-child(2n) {
        padding-left: 24px;
        border-left: 1px solid var(--line);
      }

      .overview-cell:nth-child(n + 3) {
        border-bottom: 0;
      }

      .overview-cell.action {
        background: #fbf7ef;
        padding-left: 24px;
      }

      .cell-label {
        color: var(--green);
        font-weight: 900;
      }

      .cell-copy {
        color: #3f565b;
        font-size: 18px;
        line-height: 1.75;
      }

      .card-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-top: 20px;
      }

      .tag-line {
        color: #6c7d7d;
      }

      .read-link {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 5px;
        background: var(--green);
        color: #fff;
        font-weight: 900;
        text-decoration: none;
      }

      .empty {
        padding: 22px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
      }

      .error {
        margin: 32px;
        padding: 20px;
        border: 1px solid #e2b9b3;
        border-radius: 8px;
        background: #fff7f5;
        color: #a34e43;
        white-space: pre-wrap;
      }

      @media (max-width: 1050px) {
        .shell,
        .signal-grid,
        .brief-grid,
        .media-grid,
        .overview-grid,
        .filter-grid {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .overview-cell,
        .overview-cell:nth-child(2n),
        .overview-cell.action {
          grid-template-columns: 1fr;
          padding: 18px 0;
          border-left: 0;
          border-bottom: 1px solid var(--line);
          background: transparent;
        }

        .card-foot {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

          .slice(0, 3)
          .map(itemFocus);
        const nonUs = items.filter((item) => regionOf(item) === "global-non-us").length;
        const chinaIndustry = items.filter((item) => regionOf(item) === "china" && inModule(item, "industry-progress")).length;
        const strongestModule = moduleOrder
          .map((id) => ({ id, count: items.filter((item) => inModule(item, id)).length }))
          .sort((a, b) => b.count - a.count)[0];
        return `
          <section class="focus-card" id="weekly-focus">
            <p class="kicker">\u672c\u671f\u91cd\u70b9</p>
            <h2>${T.briefTitle}</h2>
            <div class="brief-grid">
              <div class="brief-lead">
                <h3>${T.briefLeadTitle}</h3>
                <ol class="focus-list">${(ranked.length ? ranked : [T.noItems]).map((item) => `<li>${esc(item)}</li>`).join("")}</ol>
              </div>
              <div class="brief-metrics">
                <div class="brief-metric"><strong>${items.length}</strong><span>\u6838\u5b9e\u6761\u76ee</span></div>
                <div class="brief-metric"><strong>${nonUs}</strong><span>${T.globalSources}</span></div>
                <div class="brief-metric"><strong>${chinaIndustry}</strong><span>${T.chinaSignals}</span></div>
                <div class="brief-metric"><strong>${strongestModule?.count || 0}</strong><span>${esc(MODULES[strongestModule?.id]?.navLabel || "\u70ed\u70b9\u680f\u76ee")}</span></div>
              </div>
            </div>
          </section>
        `;
      }

      function evidenceText(item) {
        if (item.evidenceJudgement) return item.evidenceJudgement;
        const stage = EVIDENCE_LABELS[item.evidence?.stage] || item.evidence?.stage || "";
        const credibility = SOURCE_LABELS[item.sourceAssessment?.credibility] || item.sourceAssessment?.credibility || "\u5f85\u6838";
        return [stage, `\u6765\u6e90\uff1a${credibility}`].filter(Boolean).join("\uff1b");
      }

      function tagList(item) {
        const tags = item.tags || {};
        return uniq([...(tags.mechanisms || []), ...(tags.ingredients || []), ...(tags.competitors || [])]).slice(0, 5);
      }

      function badgeHtml(item) {
        const stage = EVIDENCE_LABELS[item.evidence?.stage] || item.evidence?.stage || "";
        return `${stage ? `<span class="badge">${esc(stage)}</span>` : ""}<span class="badge source-badge">${esc(sourceName(item))}</span>`;
      }

      function mediaField(label, value) {
        return value ? `<div class="media-field"><strong>${esc(label)}</strong><p>${esc(value)}</p></div>` : "";
      }

      function cardHtml(item) {
        const tags = tagList(item);
        const url = item.url || item.identifiers?.url || "#";
        const date = fmtDate(item.publishedAt);
        const type = itemType(item);
        const typeClass = type === "media" ? "media-card" : type === "interview" ? "interview-card" : "";
        const media = item.media || item.recommendation || {};
        const mediaBlock = type !== "evidence" ? `
          <div class="media-grid">
            ${mediaField(type === "interview" ? "\u53d7\u8bbf\u8005/\u4e3b\u8bb2\u4eba" : "\u4f5c\u8005/\u5bfc\u6f14", media.creator || media.author || media.director || item.author)}
            ${mediaField("\u56fd\u5bb6/\u5730\u533a", media.country || media.region)}
            ${mediaField("\u65e5\u671f", media.date || date)}
            ${mediaField("\u91cd\u70b9\u5173\u6ce8", media.focus || media.chapters || media.segments)}
            ${mediaField("\u7cbe\u5f69\u8282\u9009", media.excerpt)}
            ${mediaField("\u542f\u53d1", media.inspiration || item.significance)}
          </div>
        ` : "";
        return `
          <article class="weekly-card ${typeClass}">
            <div class="card-top">
              <div class="badges">${badgeHtml(item)}</div>
              <div class="score-value" title="${esc(T.scoreNote)}">${score(item)}</div>
            </div>
            <h3>${esc(item.titleZh || item.titleOriginal || item.id)}</h3>
            ${item.titleOriginal && item.titleOriginal !== item.titleZh ? `<p class="card-original">${esc(item.titleOriginal)}</p>` : ""}
            ${mediaBlock || `<div class="overview-grid">
              <div class="overview-cell">
                <div class="cell-label">${T.fact}</div>
                <div class="cell-copy">${esc(item.fact || item.confirmedChange || "")}</div>
              </div>
              <div class="overview-cell">
                <div class="cell-label">${T.judgement}</div>
                <div class="cell-copy">${esc(evidenceText(item))}</div>
              </div>
              <div class="overview-cell">
                <div class="cell-label">${T.meaning}</div>
                <div class="cell-copy">${esc(item.significance || item.whyItMatters || "")}</div>
              </div>
              <div class="overview-cell action">
                <div class="cell-label">${T.action}</div>
                <div class="cell-copy">${esc(item.recommendedAction || item.recommendedActions?.[0] || "")}</div>
              </div>
            </div>`}
            <footer class="card-foot">
              <div class="tag-line">${tags.map(esc).join(" | ")}</div>
              ${url !== "#" ? `<a class="read-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${T.read} | ${esc(sourceName(item))} \u2022 ${date}\u2197</a>` : `<span class="meta">${T.date} ${date}</span>`}
            </footer>
          </article>
        `;
      }

      function batchControlHtml({ key, pool, pageIndex, total, formalAvailable = false }) {
        const pages = Math.max(1, Math.ceil(total / SUBGROUP_BATCH_SIZE));
        const from = total ? pageIndex * SUBGROUP_BATCH_SIZE + 1 : 0;
        const to = Math.min((pageIndex + 1) * SUBGROUP_BATCH_SIZE, total);
        const meta = total ? T.batchMeta.replace("{from}", from).replace("{to}", to).replace("{total}", total) : T.noItems;
        const pageButtons = Array.from({ length: pages }, (_, index) => (
          `<button class="batch-button ${index === pageIndex ? "active" : ""}" type="button" data-batch-page="${index}" data-batch-pool="${esc(pool)}" data-batch-key="${esc(key)}">${index + 1}</button>`
        )).join("");
        return `
          <div class="batch-control">
            ${formalAvailable ? `<button class="batch-button" type="button" data-batch-formal="${esc(key)}">${T.formalReport}</button>` : ""}
            <span class="batch-meta">${esc(pool === "candidate" ? T.candidatePool : T.formalReport)} · ${esc(meta)}</span>
            <button class="batch-button" type="button" data-batch-page="${Math.max(0, pageIndex - 1)}" data-batch-pool="${esc(pool)}" data-batch-key="${esc(key)}" ${pageIndex === 0 ? "disabled" : ""}>${T.previousBatch}</button>
            ${pageButtons}
            <button class="batch-button" type="button" data-batch-page="${Math.min(pages - 1, pageIndex + 1)}" data-batch-pool="${esc(pool)}" data-batch-key="${esc(key)}" ${pageIndex >= pages - 1 ? "disabled" : ""}>${T.nextBatch}</button>
          </div>
        `;
      }

      function groupedItemsHtml(moduleId, moduleItems, candidateModuleItems = [], batchOffsets = {}) {
        const groups = SUBGROUPS[moduleId];
        if (!moduleItems.length && !candidateModuleItems.length) return `<div class="empty">${T.noItems}<br>${T.noItemsHint}</div>`;
        if (!groups) {
          const ranked = rankedItems(moduleItems);
          const candidates = rankedItems(candidateModuleItems);
          const key = `${moduleId}:__module`;
          const candidateFirst = moduleId === "media-recommendations";
          const showingCandidates = (candidateFirst || batchOffsets[key] !== undefined) && candidates.length;
          const sourceItems = showingCandidates ? candidates : ranked;
          const pageIndex = showingCandidates ? Math.floor((batchOffsets[key] || 0) / SUBGROUP_BATCH_SIZE) : Math.floor((batchOffsets[key] || 0) / SUBGROUP_BATCH_SIZE);
          const start = pageIndex * SUBGROUP_BATCH_SIZE;
          const pageItems = sourceItems.slice(start, start + SUBGROUP_BATCH_SIZE);
          const control = candidates.length
            ? (showingCandidates
              ? batchControlHtml({ key, pool: "candidate", pageIndex, total: candidates.length, formalAvailable: ranked.length > 0 })
              : `<div class="batch-control"><span class="batch-meta">${T.formalReport}</span><button class="batch-button" type="button" data-batch-page="0" data-batch-pool="candidate" data-batch-key="${esc(key)}">${T.changeBatch}</button></div>`)
            : ranked.length > SUBGROUP_BATCH_SIZE
              ? batchControlHtml({ key, pool: "formal", pageIndex, total: ranked.length })
              : "";
          return `
            <section class="subgroup-section" id="group-${esc(moduleId)}-__module">
              <div class="subgroup-head">${control}</div>
              <div class="item-stack">${pageItems.map(cardHtml).join("")}</div>
            </section>
          `;
        }
        const grouped = groups.map((group) => {
          const groupItems = rankedItems(moduleItems.filter((item) => subgroupFor(item, moduleId) === group.id));
          const candidateGroupItems = rankedItems(candidateModuleItems.filter((item) => subgroupFor(item, moduleId) === group.id));
          if (!groupItems.length && !candidateGroupItems.length) return "";
          const key = `${moduleId}:${group.id}`;
          const showingCandidates = batchOffsets[key] !== undefined && candidateGroupItems.length;
          const sourceItems = showingCandidates ? candidateGroupItems : groupItems;
          const offset = Math.min(showingCandidates ? batchOffsets[key] : 0, Math.max(0, sourceItems.length - 1));
          const start = Math.floor(offset / SUBGROUP_BATCH_SIZE) * SUBGROUP_BATCH_SIZE;
          const pageIndex = Math.floor(start / SUBGROUP_BATCH_SIZE);
          const pageItems = sourceItems.slice(start, start + SUBGROUP_BATCH_SIZE);
          const control = candidateGroupItems.length
            ? (showingCandidates
              ? batchControlHtml({ key, pool: "candidate", pageIndex, total: candidateGroupItems.length, formalAvailable: groupItems.length > 0 })
              : `<div class="batch-control"><span class="batch-meta">${T.formalReport}</span><button class="batch-button" type="button" data-batch-page="0" data-batch-pool="candidate" data-batch-key="${esc(key)}">${T.changeBatch}</button></div>`)
            : groupItems.length > SUBGROUP_BATCH_SIZE
              ? batchControlHtml({ key, pool: "formal", pageIndex, total: groupItems.length })
              : `<span class="batch-meta">${esc(T.batchMeta.replace("{from}", 1).replace("{to}", groupItems.length).replace("{total}", groupItems.length))}</span>`;
          return `
            <section class="subgroup-section" id="group-${esc(moduleId)}-${esc(group.id)}">
              <div class="subgroup-head"><h3 class="subgroup-title">${esc(group.label)}</h3>${control}</div>
              <div class="item-stack">${pageItems.map(cardHtml).join("")}</div>
            </section>
          `;
        }).join("");
        return grouped || `<div class="empty">${T.noItems}<br>${T.noItemsHint}</div>`;
      }

      function panel(title, kicker, items) {
        return `<section class="panel"><p class="kicker">${esc(kicker)}</p><h2>${esc(title)}</h2><ul>${(items || []).map((item) => `<li>${esc(item)}</li>`).join("")}</ul></section>`;
      }

      function optionList(values, allLabel, current) {
        return `<option value="">${esc(allLabel)}</option>${values.map((v) => `<option value="${esc(v)}" ${current === v ? "selected" : ""}>${esc(v)}</option>`).join("")}`;
      }

      function subgroupCount(moduleItems, moduleId, groupId) {
        return moduleItems.filter((item) => subgroupFor(item, moduleId) === groupId).length;
      }

      function subnavHtml(moduleId, moduleItems) {
        const groups = SUBGROUPS[moduleId];
        if (!groups) return "";
        return `
          <div class="subnav">
            ${groups.map((group, index) => `<button type="button" data-jump-module="${esc(moduleId)}" data-jump-group="${esc(group.id)}">${index + 1}. ${esc(group.label.split("\uff5c")[0])}<em>${subgroupCount(moduleItems, moduleId, group.id)}</em></button>`).join("")}
          </div>
        `;
      }

      function reportLabel(record, index) {
        const report = record.report || record;
        const week = report.week || record.entry?.week || `Report ${index + 1}`;
        const issue = report.issueLabel || record.entry?.issueLabel || (week.match(/W(\d{2})$/) ? `第${Number(week.match(/W(\d{2})$/)[1])}期` : "");
        const from = fmtDate(report.period?.from);
        const to = fmtDate(report.period?.to);
        return `${issue ? `${issue}｜` : ""}${week}｜${from} - ${to}`;
      }

      function focusItemsHtml(items) {
        const ranked = [...items]
          .filter((item) => score(item) !== "NA")
          .sort((a, b) => Number(score(b)) - Number(score(a)))
          .slice(0, 5);
        const source = ranked.length ? ranked : items.slice(0, 5);
        return source.length
          ? `<ol class="focus-list">${source.map((item) => `<li>${esc(item.titleZh || item.titleOriginal || item.id)}</li>`).join("")}</ol>`
          : `<p class="hint">${T.noItems}</p>`;
      }

      function render(reports, candidateRecords = []) {
        const archive = reports || [];
        let selectedIndex = Math.max(archive.length - 1, 0);

        function currentReport() {
          return archive[selectedIndex]?.report || archive[selectedIndex] || {};
        }

        function drawReport() {
        const report = currentReport();
        const baseModuleOrder = report.moduleOrder || Object.keys(MODULES);
        const reportItems = (report.items || []).filter((item) => !isStructureItem(item));
        const reportKeys = new Set(reportItems.map(dedupeKey));
        const candidateItems = selectedIndex === archive.length - 1
          ? candidateRecords.map(normalizeCandidate).filter((item) => !reportKeys.has(dedupeKey(item)))
          : [];
        const moduleOrder = !baseModuleOrder.includes("media-recommendations")
          ? [...baseModuleOrder, "media-recommendations"]
          : baseModuleOrder;
        const items = reportItems;
        const batchOffsets = {};
        const state = { module: "all", query: "", evidence: "", mechanism: "", ingredient: "", competitor: "", source: "", status: "" };
        const filterValues = {
          evidence: uniq(items.map((item) => EVIDENCE_LABELS[item.evidence?.stage] || item.evidence?.stage)),
          mechanism: uniq(items.flatMap((item) => item.tags?.mechanisms || [])),
          ingredient: uniq(items.flatMap((item) => item.tags?.ingredients || [])),
          competitor: uniq(items.flatMap((item) => item.tags?.competitors || [])),
          source: uniq(items.map(sourceName)),
          status: uniq(items.flatMap((item) => item.tags?.statuses || [])),
        };

        function itemPasses(item) {
          if (state.module !== "all" && !inModule(item, state.module)) return false;
          if (state.evidence && (EVIDENCE_LABELS[item.evidence?.stage] || item.evidence?.stage) !== state.evidence) return false;
          if (state.mechanism && !(item.tags?.mechanisms || []).includes(state.mechanism)) return false;
          if (state.ingredient && !(item.tags?.ingredients || []).includes(state.ingredient)) return false;
          if (state.competitor && !(item.tags?.competitors || []).includes(state.competitor)) return false;
          if (state.source && sourceName(item) !== state.source) return false;
          if (state.status && !(item.tags?.statuses || []).includes(state.status)) return false;
          if (state.query.trim()) return JSON.stringify(item).toLowerCase().includes(state.query.trim().toLowerCase());
          return true;
        }

        function draw() {
          const shown = items.filter(itemPasses);
          const candidateShown = candidateItems.filter(itemPasses);
          const issueText = report.issueLabel || (report.week?.match(/W(\d{2})$/) ? `第${Number(report.week.match(/W(\d{2})$/)[1])}期` : "");
          const weekText = [issueText, report.week].filter(Boolean).join(" · ");
          $("#topMeta").textContent = `${weekText} \u2022 ${shown.length}/${items.length}`;
          const nav = `
            <aside class="sidebar">
              <p class="nav-label">${T.archive}</p>
              <button class="module-button ${state.module === "all" ? "active" : ""}" data-module="all">
                <span class="module-code">00</span><span>${T.allModules}</span><em class="module-count">${items.length}</em>
              </button>
              ${moduleOrder.map((id) => {
                const moduleItems = items.filter((item) => inModule(item, id));
                const candidateModuleItems = candidateItems.filter((item) => inModule(item, id));
                const count = id === "media-recommendations" ? candidateModuleItems.length : moduleItems.length;
                return `
                  <button class="module-button ${state.module === id ? "active" : ""}" data-module="${esc(id)}">
                    <span class="module-code">${esc(MODULES[id]?.code || "")}</span>
                    <span>${esc(MODULES[id]?.navLabel || MODULES[id]?.label || id)}</span>
                    <em class="module-count">${count}</em>
                  </button>
                  ${subnavHtml(id, moduleItems)}
                `;
              }).join("")}
            </aside>
          `;

          const sections = moduleOrder.filter((id) => state.module === "all" || state.module === id).map((id) => {
            const moduleItems = shown.filter((item) => inModule(item, id));
            const candidateModuleItems = candidateShown.filter((item) => inModule(item, id));
            const visibleCount = id === "media-recommendations" ? candidateModuleItems.length : moduleItems.length;
            return `
              <section class="module-section" id="${esc(id)}">
                <header class="module-heading">
                  <div><p class="kicker">${esc(MODULES[id]?.code || "")}</p><h2>${esc(MODULES[id]?.label || id)}</h2></div>
                  <span class="meta">${visibleCount} ${T.items}</span>
                </header>
                <div class="module-items">${groupedItemsHtml(id, moduleItems, candidateModuleItems, batchOffsets)}</div>
              </section>
            `;
          }).join("");

          $("#app").innerHTML = `
            <div class="shell">
              ${nav}
              <main>
                <section class="hero" id="overview">
                  <p class="kicker">INTELLIGENCE BRIEF \u2022 ${esc(weekText)}</p>
                  <h1>${T.title}</h1>
                  <p class="hero-foot">${T.period} ${esc(fmtDate(report.period?.from))} - ${esc(fmtDate(report.period?.to))}</p>
                </section>
                <section class="archive-card" id="archive">
                  <p class="kicker">\u5f80\u671f\u5f52\u6863</p>
                  <h2>\u4ee5\u5f80\u5468\u62a5</h2>
                  <label><span>\u9009\u62e9\u5468\u6b21</span><select id="archiveSelect">${archive.map((record, index) => `<option value="${index}" ${index === selectedIndex ? "selected" : ""}>${esc(reportLabel(record, index))}</option>`).join("")}</select></label>
                </section>
                ${briefHtml(items, moduleOrder)}
                <section class="workspace-head">
                  <div><p class="kicker">EVIDENCE WORKSPACE</p><h2>${T.workbench}</h2></div>
                  <p class="meta">${T.shown} <strong>${shown.length}</strong> / ${items.length} ${T.items}</p>
                </section>
                <section class="filter-panel">
                  <label class="search-field"><span>${T.search}</span><input id="query" value="${esc(state.query)}" placeholder="${T.searchPlaceholder}"></label>
                  <div class="filter-grid">
                    <label><span>${T.evidence}</span><select id="evidence">${optionList(filterValues.evidence, T.allEvidence, state.evidence)}</select></label>
                    <label><span>${T.mechanism}</span><select id="mechanism">${optionList(filterValues.mechanism, T.allMechanism, state.mechanism)}</select></label>
                    <label><span>${T.ingredient}</span><select id="ingredient">${optionList(filterValues.ingredient, T.allIngredient, state.ingredient)}</select></label>
                    <label><span>${T.competitor}</span><select id="competitor">${optionList(filterValues.competitor, T.allCompetitor, state.competitor)}</select></label>
                    <label><span>${T.source}</span><select id="source">${optionList(filterValues.source, T.allSource, state.source)}</select></label>
                    <label><span>${T.status}</span><select id="status">${optionList(filterValues.status, T.allStatus, state.status)}</select></label>
                  </div>
                  <div class="score-note"><strong>${T.score}</strong> ${T.scoreNote}</div>
                </section>
                ${sections}
              </main>
            </div>
          `;

          document.getElementById("archiveSelect")?.addEventListener("change", (event) => {
            selectedIndex = Number(event.target.value) || 0;
            drawReport();
          });
          document.querySelectorAll("[data-module]").forEach((button) => button.addEventListener("click", () => {
            state.module = button.dataset.module;
            draw();
          }));
          document.querySelectorAll("[data-jump-module]").forEach((button) => button.addEventListener("click", () => {
            const moduleId = button.dataset.jumpModule;
            const groupId = button.dataset.jumpGroup;
            state.module = moduleId;
            draw();
            requestAnimationFrame(() => {
              document.getElementById(`group-${moduleId}-${groupId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          }));
          document.querySelectorAll("[data-batch-page]").forEach((button) => button.addEventListener("click", () => {
            const key = button.dataset.batchKey;
            const page = Number(button.dataset.batchPage) || 0;
            batchOffsets[key] = page * SUBGROUP_BATCH_SIZE;
            draw();
            requestAnimationFrame(() => {
              const [moduleId, groupId] = key.split(":");
              document.getElementById(`group-${moduleId}-${groupId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          }));
          document.querySelectorAll("[data-batch-formal]").forEach((button) => button.addEventListener("click", () => {
            const key = button.dataset.batchFormal;
            delete batchOffsets[key];
            draw();
            requestAnimationFrame(() => {
              const [moduleId, groupId] = key.split(":");
              document.getElementById(`group-${moduleId}-${groupId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          }));
          ["query", "evidence", "mechanism", "ingredient", "competitor", "source", "status"].forEach((id) => {
            document.getElementById(id).addEventListener("input", (event) => {
              state[id] = event.target.value;
              Object.keys(batchOffsets).forEach((key) => delete batchOffsets[key]);
              draw();
            });
          });
        }

        draw();
      }
        drawReport();
      }

      async function main() {
        try {
          const response = await fetch("/longevity-auto-weekly/reports.json?v=20260807-no-quality", { cache: "no-store" });
          if (!response.ok) throw new Error(`reports.json HTTP ${response.status}`);
          const data = await response.json();
          const reports = data.reports || [];
          if (!reports.length) throw new Error("No report in reports.json");
          let candidateRecords = [];
          try {
            const candidateResponse = await fetch("/longevity-auto-weekly/staging/weekly-candidates.json?v=20260807-no-quality", { cache: "no-store" });
            if (candidateResponse.ok) {
              const candidateData = await candidateResponse.json();
              candidateRecords = candidateData.records || [];
            }
          } catch (_) {}
          render(reports, candidateRecords);
        } catch (error) {
          document.getElementById("app").innerHTML = `<pre class="error">${esc(error.stack || error.message || error)}</pre>`;
        }
      }

      main();
    </script>
  </body>
</html>
